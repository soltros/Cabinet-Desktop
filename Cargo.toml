[package]
name = "cabinet-desktop"
version = "0.1.0"
edition = "2021"
authors = ["soltros"]
description = "Native Rust desktop client for Cabinet"
license = "GPL-3.0-only"
repository = "https://github.com/soltros/Cabinet-Desktop"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
directories = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.25"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.packager]
product-name = "Cabinet"
identifier = "info.soltros.cabinet.desktop"
formats = ["app", "dmg", "nsis", "wix", "deb", "appimage", "pacman"]
homepage = "https://github.com/soltros/Cabinet-Desktop"
license-file = "LICENSE"
category = "Utility"
description = "Native Rust desktop client for the Cabinet self-hosted file locker"
