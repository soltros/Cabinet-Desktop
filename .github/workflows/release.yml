name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libfuse2 \
            rpm

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          choco install wixtoolset -y

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Install RPM generator
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo packager --release --formats deb,appimage,pacman
          cargo generate-rpm

      - name: Package Windows
        if: runner.os == 'Windows'
        run: cargo packager --release --formats nsis,wix

      - name: Package macOS
        if: runner.os == 'macOS'
        run: cargo packager --release --formats app,dmg

      - name: Collect Linux RPM
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/generate-rpm/*.rpm dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-desktop-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "Cabinet Desktop ${GITHUB_REF_NAME}" \
            --generate-notes \
            release-artifacts/*
