name: Rust checks

permissions:
  contents: write

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cabinet-desktop-${{ runner.os }}

      - name: Generate Cargo.lock
        if: runner.os == 'Linux'
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock Rust dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgtk-3-dev             libayatana-appindicator3-dev             libxdo-dev             libxkbcommon-dev             libdbus-1-dev

      - name: Cargo check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check
